<!doctype html>
<html lang="en">
  <head>
    <!--
      UTF-8 supports the apostrophe and any future multilingual content.
      The viewport tag makes the layout scale correctly on phones and tablets.
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple Hello World page for Cloudflare Pages." />
    <title>Hello World!</title>

    <!--
      Keep presentation rules in a separate file so the page structure remains
      easy to read and future visual changes do not affect the content markup.
    -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--
      `main` identifies the primary page content for assistive technologies.
      The card container also gives one stable place to add more content later.
    -->
    <main class="page-shell">
      <section class="welcome-card" aria-labelledby="page-title">
        <!-- Change this heading to update the main title shown to visitors. -->
        <h1 id="page-title">Hello World!</h1>

        <!-- Change this paragraph to update the introductory message. -->
        <p>I'm Chansik Yun</p>
      </section>
    </main>
  </body>
</html>
